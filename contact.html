
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Alex through his portfolio website.">
    <title>Contact | Alex</title>
    <link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="favicon.png?v=2">
</head>

<body class="contact-page">

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main>

        <div class="contact-container">

            <h1>Contact Me</h1>

            <p>Have a question or an idea? Send me a message!</p>

            
<form id="contact-form"
      action="https://formspree.io/f/mbdqarge"
      method="POST">

    <input type="hidden"
           name="_subject"
           value="New message from Alex's Portfolio">

    <div class="contact-form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name"
               placeholder="Your name" required data-fs-field>
        <span data-fs-error="name"></span>
    </div>

    <div class="contact-form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Your email" required data-fs-field>
        <span data-fs-error="email"></span>
    </div>

    <div class="contact-form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message"
                  placeholder="Your message..." required data-fs-field></textarea>
        <span data-fs-error="message"></span>
    </div>

    <div class="form-success" data-fs-success>
        <h2>✓ Message sent!</h2>
        <p>Thank you for reaching out, I'll get back to you soon!</p>
    </div>

    <div data-fs-error></div>

    <button type="submit" class="contact-submit" data-fs-submit-btn>
        Send Message
    </button>

</form>


        </div>

    </main>

    <script src="script.js"></script>
	<script>
    window.formspree = window.formspree || function () {
        (formspree.q = formspree.q || []).push(arguments);
    };

    formspree('initForm', {
        formElement: '#contact-form',
        formId: 'mbdqarge'
    });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
