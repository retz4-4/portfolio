
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Alex through his portfolio website.">
    <title>Contact | Alex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main>

        <div class="contact-container">

            <h1>Contact Me</h1>

            <p>Have a question or an idea? Send me a message!</p>

            <form action="https://formspree.io/f/mbdqarge"
                  method="POST">

                <input type="hidden"
                       name="_subject"
                       value="New message from Alex's Portfolio">

                <div class="contact-form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required>
                </div>

                <div class="contact-form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Your email"
                        required>
                </div>

                <div class="contact-form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Your message..."
                        required></textarea>
                </div>

                <button type="submit" class="contact-submit">
                    Send Message
                </button>

            </form>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
